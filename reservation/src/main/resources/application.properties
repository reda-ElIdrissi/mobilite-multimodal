spring.application.name=reservation
spring.mvc.problemdetails.enabled=true
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MOBILITY_ISSUER:http://localhost:8088/realms/mobility}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MOBILITY_JWKS:http://localhost:8088/realms/mobility/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=mobility-api
mobility.reservation.secret=${MOBILITY_RESERVATION_SECRET:}
mobility.reservation.token-url=${MOBILITY_TOKEN_URL:http://localhost:8088/realms/mobility/protocol/openid-connect/token}
mobility.reservation.pricing-url=${PRICING_URL:http://localhost:8094}
mobility.reservation.rail-url=${RAIL_BRIDGE_URL:http://localhost:8091}
mobility.reservation.air-url=${AIR_BRIDGE_URL:http://localhost:8092}
mobility.reservation.car-url=${AUTOPARTAGE_URL:http://localhost:8090}
spring.task.scheduling.pool.size=3

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
