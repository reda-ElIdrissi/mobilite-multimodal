spring.application.name=api-gateway
mobility.autopartage-url=${AUTOPARTAGE_URL:http://localhost:8090}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MOBILITY_ISSUER:http://localhost:8088/realms/mobility}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MOBILITY_JWKS:http://localhost:8088/realms/mobility/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=mobility-api
mobility.web-origin=${MOBILITY_WEB_ORIGIN:http://localhost:3000}
mobility.bff-url=${SEARCH_BFF_URL:http://localhost:8093}
mobility.pricing-url=${PRICING_URL:http://localhost:8094}
mobility.reservation-url=${RESERVATION_URL:http://localhost:8095}
mobility.notification-url=${NOTIFICATION_URL:http://localhost:8096}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
