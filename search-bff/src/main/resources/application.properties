spring.application.name=search-bff
mobility.rail-url=${RAIL_BRIDGE_URL:http://localhost:8091}
mobility.air-url=${AIR_BRIDGE_URL:http://localhost:8092}
mobility.car-url=${AUTOPARTAGE_URL:http://localhost:8090}
mobility.token-url=${MOBILITY_TOKEN_URL:http://localhost:8088/realms/mobility/protocol/openid-connect/token}
mobility.bff-secret=${MOBILITY_BFF_SECRET:}
spring.mvc.problemdetails.enabled=true
mobility.pricing-url=${PRICING_URL:http://localhost:8094}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MOBILITY_ISSUER:http://localhost:8088/realms/mobility}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MOBILITY_JWKS:http://localhost:8088/realms/mobility/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=mobility-api
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
