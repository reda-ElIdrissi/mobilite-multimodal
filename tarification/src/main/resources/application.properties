spring.application.name=tarification
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MOBILITY_ISSUER:http://localhost:8088/realms/mobility}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MOBILITY_JWKS:http://localhost:8088/realms/mobility/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=mobility-api
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false
mobility.pricing.reservation-url=${RESERVATION_URL:http://localhost:8095}
mobility.pricing.token-url=${MOBILITY_TOKEN_URL:http://localhost:8088/realms/mobility/protocol/openid-connect/token}
mobility.pricing.secret=${MOBILITY_PRICING_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
