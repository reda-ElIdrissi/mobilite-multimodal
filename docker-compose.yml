x-student-telemetry: &student-telemetry
  JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_LOGS_EXPORTER: none
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_INSTRUMENTATION_COMMON_DB_STATEMENT_SANITIZER_ENABLED: "true"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

x-student-health: &student-health
  test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
  interval: 10s
  timeout: 3s
  start_period: 50s
  retries: 10

services:
  rail:
    build:
      context: ./starter-kit-mobilite/rail-operator-corba
      dockerfile: Dockerfile
    environment:
      CORBA_ADVERTISED_HOST: rail
      CORBA_PORT: "1050"
      IOR_FILE: /ior/RailBooking.ior
    ports:
      - "127.0.0.1:1050:1050"
    volumes:
      - ${MOBILITY_IOR_DIR:-./.runtime/ior}:/ior
  air:
    build: ./starter-kit-mobilite/air-partner-soap
    ports:
      - "127.0.0.1:8081:8080"
  smoke:
    profiles: [smoke]
    build:
      context: .
      dockerfile: infra/smoke.Dockerfile
    volumes:
      - ${MOBILITY_IOR_DIR:-./.runtime/ior}:/ior:ro
    command:
      - sh
      - -ec
      - |
        mvn -B -ntp -f rail-bridge/pom.xml exec:java -Dexec.args=/ior/RailBooking.ior
        mvn -B -ntp -f air-bridge/pom.xml exec:java -Dexec.args=http://air:8080/ws
  postgres-test:
    profiles: [test]
    image: postgres:17.7
    environment:
      POSTGRES_DB: autopartage_test
      POSTGRES_USER: autopartage_test
      POSTGRES_PASSWORD: lot0_local_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, autopartage_test, -d, autopartage_test]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm, --hostname=http://localhost:8088]
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/mobility/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost:8088\r\n\r\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      start_period: 180s
      retries: 16
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: mobility-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MOBILITY_ADMIN_PASSWORD:-mobility-local-admin}
      MOBILITY_DEMO_TRAVELER_PASSWORD: ${MOBILITY_DEMO_TRAVELER_PASSWORD:-mobility-local-traveler}
      MOBILITY_BFF_SECRET: &demo-bff ${MOBILITY_BFF_SECRET:-mobility-local-bff}
      MOBILITY_PRICING_SECRET: &demo-pricing ${MOBILITY_PRICING_SECRET:-mobility-local-pricing}
      MOBILITY_RESERVATION_SECRET: &demo-reservation ${MOBILITY_RESERVATION_SECRET:-mobility-local-reservation}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: mobility_local_keycloak
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./infra/keycloak/mobility-realm.json:/opt/keycloak/data/import/mobility-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
  keycloak-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: mobility_local_keycloak
    healthcheck:
      test: [CMD, pg_isready, -U, keycloak, -d, keycloak, -h, 127.0.0.1]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - identity-data:/var/lib/postgresql/data
  autopartage-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: autopartage
      POSTGRES_USER: autopartage
      POSTGRES_PASSWORD: mobility_local_car
    healthcheck:
      test: [CMD, pg_isready, -U, autopartage, -d, autopartage, -h, 127.0.0.1]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - car-data:/var/lib/postgresql/data
  autopartage:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: autopartage
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: autopartage
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://autopartage-db:5432/autopartage
      SPRING_DATASOURCE_USERNAME: autopartage
      SPRING_DATASOURCE_PASSWORD: mobility_local_car
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
    depends_on:
      autopartage-db:
        condition: service_healthy
  api-gateway:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: api-gateway
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: api-gateway
      AUTOPARTAGE_URL: http://autopartage:8080
      SEARCH_BFF_URL: http://search-bff:8080
      RESERVATION_URL: http://reservation:8080
      NOTIFICATION_URL: http://notification:8080
      PRICING_URL: http://tarification:8080
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - keycloak
      - autopartage

  rail-bridge:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: rail-bridge
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: rail-bridge
      RAIL_IOR: /ior/RailBooking.ior
      SPRING_DATASOURCE_URL: jdbc:postgresql://rail-bridge-db:5432/railbridge
      SPRING_DATASOURCE_USERNAME: railbridge
      SPRING_DATASOURCE_PASSWORD: mobility_local_rail
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
    volumes:
      - ${MOBILITY_IOR_DIR:-./.runtime/ior}:/ior:ro
    depends_on:
      rail:
        condition: service_started
      keycloak:
        condition: service_started
      rail-bridge-db:
        condition: service_healthy
  air-bridge:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: air-bridge
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: air-bridge
      AIR_SOAP_URL: http://air:8080/ws
      SPRING_DATASOURCE_URL: jdbc:postgresql://air-bridge-db:5432/airbridge
      SPRING_DATASOURCE_USERNAME: airbridge
      SPRING_DATASOURCE_PASSWORD: mobility_local_air
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
    depends_on:
      air:
        condition: service_started
      keycloak:
        condition: service_started
      air-bridge-db:
        condition: service_healthy
  search-bff:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: search-bff
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: search-bff
      SPRING_PROFILES_ACTIVE: demo
      RAIL_BRIDGE_URL: http://rail-bridge:8080
      AIR_BRIDGE_URL: http://air-bridge:8080
      AUTOPARTAGE_URL: http://autopartage:8080
      MOBILITY_TOKEN_URL: http://keycloak:8080/realms/mobility/protocol/openid-connect/token
      MOBILITY_BFF_SECRET: *demo-bff
      PRICING_URL: http://tarification:8080
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
    depends_on:
      - rail-bridge
      - air-bridge
      - autopartage
      - tarification

  tarification-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: tarification
      POSTGRES_USER: tarification
      POSTGRES_PASSWORD: mobility_local_pricing
    healthcheck:
      test: [CMD, pg_isready, -U, tarification, -d, tarification, -h, 127.0.0.1]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - pricing-data:/var/lib/postgresql/data
  tarification:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: tarification
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: tarification
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://tarification-db:5432/tarification
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mobility
      SPRING_RABBITMQ_PASSWORD: mobility_local_events
      MOBILITY_PRICING_SECRET: *demo-pricing
      MOBILITY_TOKEN_URL: http://keycloak:8080/realms/mobility/protocol/openid-connect/token
      RESERVATION_URL: http://reservation:8080
      SPRING_DATASOURCE_USERNAME: tarification
      SPRING_DATASOURCE_PASSWORD: mobility_local_pricing
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
    depends_on:
      tarification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  rail-bridge-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: railbridge
      POSTGRES_USER: railbridge
      POSTGRES_PASSWORD: mobility_local_rail
    healthcheck:
      test: [CMD, pg_isready, -U, railbridge, -d, railbridge, -h, 127.0.0.1]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - rail-journal-data:/var/lib/postgresql/data
  air-bridge-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: airbridge
      POSTGRES_USER: airbridge
      POSTGRES_PASSWORD: mobility_local_air
    healthcheck:
      test: [CMD, pg_isready, -U, airbridge, -d, airbridge, -h, 127.0.0.1]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - air-journal-data:/var/lib/postgresql/data

  reservation:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: reservation
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: reservation
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://reservation-db:5432/reservation
      SPRING_DATASOURCE_USERNAME: reservation
      SPRING_DATASOURCE_PASSWORD: mobility_local_reservation
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mobility
      SPRING_RABBITMQ_PASSWORD: mobility_local_events
      MOBILITY_RESERVATION_SECRET: *demo-reservation
      MOBILITY_TOKEN_URL: http://keycloak:8080/realms/mobility/protocol/openid-connect/token
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
      PRICING_URL: http://tarification:8080
      RAIL_BRIDGE_URL: http://rail-bridge:8080
      AIR_BRIDGE_URL: http://air-bridge:8080
      AUTOPARTAGE_URL: http://autopartage:8080
    depends_on:
      reservation-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tarification:
        condition: service_started
      rail-bridge:
        condition: service_started
      air-bridge:
        condition: service_started
      autopartage:
        condition: service_started
  reservation-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: mobility_local_reservation
    healthcheck:
      test: [CMD, pg_isready, -U, reservation, -d, reservation, -h, 127.0.0.1]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - reservation-data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4.2.9-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mobility
      RABBITMQ_DEFAULT_PASS: mobility_local_events
    healthcheck:
      test: [CMD, gosu, rabbitmq, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 4s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  notification:
    build:
      context: .
      dockerfile: infra/student.Dockerfile
      args:
        MODULE: notification
    healthcheck: *student-health
    environment:
      <<: *student-telemetry
      OTEL_SERVICE_NAME: notification
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: mobility_local_notification
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: mobility
      SPRING_RABBITMQ_PASSWORD: mobility_local_events
      MOBILITY_JWKS: http://keycloak:8080/realms/mobility/protocol/openid-connect/certs
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  notification-db:
    image: postgres:17.7
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: mobility_local_notification
    healthcheck:
      test: [CMD, pg_isready, -U, notification, -d, notification, -h, 127.0.0.1]
      interval: 3s
      timeout: 2s
      retries: 15
    volumes:
      - notification-data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.1
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./infra/observability/collector.yml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    ports:
      - "127.0.0.1:9464:9464"
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686"


volumes:
  notification-data:
  rabbitmq-data:
  reservation-data:
  air-journal-data:
  rail-journal-data:
  pricing-data:
  identity-data:
  car-data:
