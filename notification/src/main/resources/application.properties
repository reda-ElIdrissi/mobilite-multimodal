spring.application.name=notification
spring.mvc.problemdetails.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${MOBILITY_ISSUER:http://localhost:8088/realms/mobility}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${MOBILITY_JWKS:http://localhost:8088/realms/mobility/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=mobility-api

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
